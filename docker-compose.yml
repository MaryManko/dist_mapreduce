services:
  master:
    build: .
    command: uvicorn master.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    networks:
      - cluster_net

  worker1:
    build: .
    environment:
      - MASTER_URL=http://master:8000
      - WORKER_URL=http://worker1:8001
    command: uvicorn worker.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    networks:
      - cluster_net

  worker2:
    build: .
    environment:
      - MASTER_URL=http://master:8000
      - WORKER_URL=http://worker2:8002
    command: uvicorn worker.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    networks:
      - cluster_net

networks:
  cluster_net: